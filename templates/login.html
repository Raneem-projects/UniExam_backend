<!DOCTYPE html>
<html>
<head>
    <title>Instructor Login</title>
    <style>
        .header{
            position: fixed;
            background:#1e88e5;
            color:white;
            padding:15px 30px;
            font-size:22px;
            font-weight:bold;
            top: 0;
            left: 0;
            right: 0;
            z-index: 0;
        }

        .container{
            padding:30px;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f6fa;
            font-family: Arial;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="header">
    UniExam 
</div>

<div class="container">

<div class="login-box">
    <h2>Instructor Login</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Enter</button>
    </form>
</div>
</div>

</body>
</html>
