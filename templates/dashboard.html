<!DOCTYPE html>
<html>
<head>
    <title>Instructor Dashboard</title>
    <style>
        body { font-family: Arial; background:#f5f7fb; margin:0; }
        .header { background:#1e88e5; color:white; padding:15px 30px; font-size:22px; font-weight:bold; }
        .container { padding:30px; }
        .card { background:white; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        table { width:100%; border-collapse:collapse; }
        th { text-align:left; padding:12px; background:#eef2f7; }
        td { padding:12px; border-top:1px solid #eee; }
        .btn { padding:6px 12px; border:none; border-radius:6px; cursor:pointer; font-size:13px; margin-right:5px; }
        .session { background:#26a69a; color:white; }
        .sub { background:#5c6bc0; color:white; }
        .del { background:#e53935; color:white; }
        .top-bar { display:flex; justify-content:space-between; margin-bottom:20px; }
        .create-btn { background:#1e88e5; color:white; padding:10px 16px; border:none; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>
<div class="header">UniExam — Instructor Dashboard</div>
<div class="container">
    <div class="top-bar">
        <h2>Exams</h2>
        <button class="create-btn" onclick="window.location.href='/create_exam_page'">+ Upload Exam</button>
    </div>
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Exam Title</th>
                    <th>Course</th>
                    <th>Instructor</th>
                    <th>Duration</th>
                    <th>Total Marks</th>
                    <th>Submissions</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="examTable"></tbody>
        </table>
    </div>
</div>
<script>
function loadExams() {
    fetch("/api/doctor/exams").then(r=>r.json()).then(exams=>{
        const table = document.getElementById("examTable");
        table.innerHTML = "";
        exams.forEach(exam=>{
            table.innerHTML += `
            <tr>
                <td>${exam.title}</td>
                <td>${exam.course_code}</td>
                <td>${exam.instructor||"-"}</td>
                <td>${exam.duration_minutes||"-"} min</td>
                <td>${exam.total_marks||"-"}</td>
                <td>${exam.total_students}</td>
                <td>
                    <button class="btn session" onclick="createSession('${exam.exam_id}')">Session</button>
                    <button class="btn sub" onclick="viewSubmissions('${exam.exam_id}')">Submissions</button>
                    <button class="btn del" onclick="deleteExam('${exam.exam_id}')">Delete</button>
                </td>
            </tr>`;
        });
    });
}
function createSession(id){ window.location.href=`/create_session_page?exam_id=${id}`; }
function viewSubmissions(id){ window.location.href=`/submissions_page?exam_id=${id}`; }
function deleteExam(id){
    if(!confirm("Delete this exam and all its data?")) return;
    fetch(`/api/doctor/delete_exam/${id}`,{method:"DELETE"})
    .then(r=>r.json()).then(d=>{ if(d.status=="deleted") loadExams(); else alert("Error: "+d.error); });
}
loadExams();
</script>
</body>
</html>
